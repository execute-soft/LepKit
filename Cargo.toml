[package]
name = "leptos-setter"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8"
log = "0.4.33"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "Document", "Element", "DomTokenList", "CssStyleDeclaration", "IntersectionObserver", "IntersectionObserverEntry"] }
